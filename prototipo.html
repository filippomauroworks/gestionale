<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gestionale – Filippo Mauro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&family=EB+Garamond:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFFFFF; --surface:#FAF6EF; --ink:#211B14; --muted:#6E6357;
  --accent:#854F0B; --accent-ink:#FFFFFF; --accent-soft:#F6EBDA;
  --rule:#E6DAC5; --rule-strong:#CDBB9C; --ok:#3F6B3A; --err:#9A2B1E;
  --serif:"EB Garamond", Garamond, "Times New Roman", serif;
  --sans:"DM Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#16130F; --surface:#1F1A15; --ink:#EEE6D8; --muted:#A99D8C;
    --accent:#D9A156; --accent-ink:#1B140A; --accent-soft:#2B2217;
    --rule:#3A3128; --rule-strong:#55483A; --ok:#8DBB84; --err:#E3826F;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#16130F; --surface:#1F1A15; --ink:#EEE6D8; --muted:#A99D8C;
  --accent:#D9A156; --accent-ink:#1B140A; --accent-soft:#2B2217;
  --rule:#3A3128; --rule-strong:#55483A; --ok:#8DBB84; --err:#E3826F;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:15px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* Guscio */
.app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;border-right:1px solid var(--rule);padding:28px 16px;display:flex;flex-direction:column;gap:32px}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:inherit;padding:0 4px}
.mono{font-family:var(--serif);font-weight:600;font-size:22px;color:var(--accent);border:1.5px solid var(--accent);width:44px;height:44px;display:grid;place-items:center;border-radius:2px;flex:none}
.brand-name{font-family:var(--serif);font-size:18px;line-height:1.15}
.brand-name small{display:block;font-family:var(--sans);font-size:12px;color:var(--muted);margin-top:2px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:6px;text-decoration:none;color:var(--muted);font-weight:500}
.nav a:hover{background:var(--surface);color:var(--ink)}
.nav a[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
.nav svg,.tabbar svg,.topbar svg{width:19px;height:19px;flex:none}
.nav-bottom{margin-top:auto}
.topbar,.tabbar{display:none}
main{min-width:0;padding:40px clamp(20px,4vw,56px) 80px}
.page{max-width:980px}

/* Tipografia e componenti */
h1{font-family:var(--serif);font-weight:500;font-size:36px;line-height:1.1;margin:0}
h2{font-family:var(--serif);font-weight:500;font-size:23px;line-height:1.2;margin:0 0 12px}
.page-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px;padding-bottom:20px;border-bottom:1px solid var(--rule);margin-bottom:20px}
.page-head p{margin:6px 0 0;color:var(--muted)}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{appearance:none;border:1px solid var(--rule-strong);background:var(--bg);padding:8px 16px;border-radius:6px;font-weight:500;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;min-height:40px;color:var(--ink)}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn:disabled{opacity:.45;cursor:default;border-color:var(--rule-strong);color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08);color:var(--accent-ink)}
.btn.small{padding:4px 10px;min-height:32px;font-size:13px}
.search{width:100%;max-width:320px;padding:9px 12px;border:1px solid var(--rule-strong);border-radius:6px;background:var(--bg)}
.toolbar{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:8px}
.muted{color:var(--muted)}
.fname{word-break:break-all}
.section-gap{margin-top:40px}

/* Elenco documenti */
.doc{border-bottom:1px solid var(--rule)}
.doc-row{display:grid;grid-template-columns:minmax(0,1fr) 120px 52px auto;gap:16px;align-items:center;padding:14px 4px}
.c-main{display:flex;gap:16px;align-items:baseline;min-width:0}
.code{font-family:var(--serif);font-size:19px;color:var(--accent);font-variant-numeric:lining-nums tabular-nums;flex:none;width:92px}
.doc-title{font-weight:500}
.doc-client,.c-date{color:var(--muted);font-size:14px}
.vbadge{font-size:12px;font-weight:600;border:1px solid var(--rule-strong);border-radius:4px;padding:1px 6px;justify-self:start;color:var(--muted)}
.c-act{display:flex;gap:6px}
details.versions{padding:0 4px 14px 112px}
details.versions summary{cursor:pointer;color:var(--muted);font-size:13px;width:max-content}
.vlist{list-style:none;margin:8px 0 0;padding:0;font-size:13px}
.vlist li{display:flex;justify-content:space-between;gap:16px;padding:6px 0;border-top:1px dashed var(--rule)}
.empty{padding:32px 0;color:var(--muted)}

/* Home */
.quick{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.tile{appearance:none;text-align:left;border:1px solid var(--rule);background:var(--bg);border-radius:8px;padding:18px;cursor:pointer;color:var(--ink)}
.tile:hover{border-color:var(--accent)}
.tile strong{display:block;font-family:var(--serif);font-weight:500;font-size:21px;margin-bottom:4px}
.tile span{color:var(--muted);font-size:14px}
.draft-card{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;border:1px solid var(--accent);background:var(--accent-soft);border-radius:8px;padding:16px 18px}

/* Procedura guidata */
.wiz{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:40px;max-width:1120px}
.wiz-back{font-size:14px;color:var(--muted);text-decoration:none}
.wiz-back:hover{color:var(--accent)}
.wiz-title{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:8px}
.steps{list-style:none;display:flex;gap:6px;padding:0;margin:22px 0 32px}
.steps li{flex:1;min-width:0}
.steps button{width:100%;text-align:left;background:none;border:0;border-top:3px solid var(--rule);padding:8px 0 0;font-size:13px;color:var(--muted);cursor:pointer}
.steps button:disabled{cursor:default}
.steps .done button{border-top-color:var(--rule-strong);color:var(--ink)}
.steps .cur button{border-top-color:var(--accent);color:var(--accent);font-weight:600}
.steps .n{display:block;font-family:var(--serif);font-size:17px;line-height:1.2}
.steps .lbl{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.field-q{font-size:27px;margin-bottom:6px}
.hint{color:var(--muted);margin:0 0 20px}
.opt{display:flex;gap:14px;align-items:flex-start;padding:13px 16px;border:1px solid var(--rule);border-radius:8px;cursor:pointer;margin-bottom:8px;max-width:560px}
.opt:hover{border-color:var(--rule-strong)}
.opt:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.opt input{accent-color:var(--accent);margin-top:4px;flex:none}
.opt small{display:block;color:var(--muted);font-size:13px}
.f{display:block;margin-bottom:18px}
.f>span{display:block;font-size:13px;font-weight:500;margin-bottom:6px}
.inp{width:100%;max-width:420px;padding:10px 12px;border:1px solid var(--rule-strong);border-radius:6px;background:var(--bg);min-height:42px}
.sub{margin:4px 0 16px 18px;padding:4px 0 4px 18px;border-left:2px solid var(--rule);max-width:600px}
.tog{display:flex;gap:14px;align-items:flex-start;padding:13px 16px;border:1px solid var(--rule);border-radius:8px;cursor:pointer;margin-bottom:8px;max-width:600px}
.tog:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.tog input{appearance:none;-webkit-appearance:none;width:36px;height:20px;border-radius:10px;background:var(--rule-strong);position:relative;flex:none;margin:2px 0 0;cursor:pointer;transition:background .15s}
.tog input::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--bg);transition:transform .15s}
.tog input:checked{background:var(--accent)}
.tog input:checked::after{transform:translateX(16px)}
.tog small{display:block;color:var(--muted);font-size:13px}
.inp.num{max-width:120px}
textarea.inp{min-height:88px;resize:vertical;max-width:600px;line-height:1.45}
.fase-row{display:flex;gap:6px;align-items:center;margin-bottom:6px;max-width:600px}
.fase-row .inp{max-width:none;flex:1}
.rate-row{display:grid;grid-template-columns:22px 110px 16px minmax(0,1fr);gap:8px;align-items:center;margin-bottom:10px;max-width:600px}
.rate-row .inp{max-width:none}
.rate-row .extra{grid-column:2/-1;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.rate-row .extra:empty{display:none}
.rn{font-family:var(--serif);font-size:19px;color:var(--accent)}
.conv{font-size:13px;color:var(--muted)}
.check{font-size:14px;font-weight:500;margin:4px 0 8px}
.check.ok{color:var(--ok)}
.check.bad{color:var(--err)}
.frase{margin-top:24px;max-width:600px;border:1px dashed var(--rule-strong);border-radius:8px;padding:14px 16px;background:var(--surface)}
.frase small{color:var(--muted);display:block;margin-bottom:4px;font-size:12px}
.frase p{margin:0;font-family:var(--serif);font-size:17px;line-height:1.45}
.grp{font-family:var(--sans);font-size:14px;font-weight:600;margin:26px 0 10px}
.lettere{font-size:13px;color:var(--muted);margin-top:6px;min-height:1.4em}
.note{border-left:3px solid var(--accent);background:var(--accent-soft);padding:10px 14px;border-radius:0 6px 6px 0;margin:16px 0;font-size:14px;max-width:560px}
.err{color:var(--err);font-size:14px;min-height:1.5em;margin-top:8px}
.wiz-foot{display:flex;justify-content:space-between;gap:12px;margin-top:24px;padding-top:20px;border-top:1px solid var(--rule)}
.out{border:1px solid var(--rule);border-radius:8px;padding:16px 18px;margin-top:20px;max-width:620px}
.out p{margin:0 0 8px}
.out p:last-child{margin:0}
.panel{position:sticky;top:40px;align-self:start;border:1px solid var(--rule);border-radius:8px;padding:20px;background:var(--surface)}
.panel h3{font-family:var(--serif);font-weight:500;font-size:21px;margin:0 0 14px}
.sum{margin:0;display:grid;grid-template-columns:auto minmax(0,1fr);gap:7px 14px;font-size:14px}
.sum dt{color:var(--muted)}
.sum dd{margin:0}
.saved{font-size:12px;color:var(--muted);margin-top:16px;padding-top:12px;border-top:1px solid var(--rule)}
.panel-toggle,.panel-close{display:none}

/* Preventivi */
.drafts{display:grid;gap:12px;margin-bottom:24px}
.row2{display:flex;gap:20px;flex-wrap:wrap}
.cnt{font-size:12px;color:var(--muted);margin-top:5px}
.voce{border:1px solid var(--rule);border-radius:8px;padding:12px 14px;margin-bottom:8px;max-width:700px}
.voce.on{border-color:var(--accent)}
.vhead{display:flex;gap:12px;align-items:flex-start;cursor:pointer}
.vhead input[type="checkbox"]{accent-color:var(--accent);margin-top:4px;width:16px;height:16px;flex:none}
.vtxt{min-width:0;flex:1}
.vtxt small{display:block;color:var(--muted);font-size:13px}
.vlist{font-size:12px;color:var(--muted);white-space:nowrap;text-align:right;padding-top:2px}
.vbody{display:flex;flex-wrap:wrap;gap:10px 12px;align-items:flex-end;margin-top:12px;padding-top:12px;border-top:1px dashed var(--rule)}
.vbody label>span{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
.vbody .inp{max-width:none;min-height:38px;padding:7px 10px}
.w-u{width:150px}.w-n{width:72px}.w-p{width:96px}
.vimp{margin-left:auto;font-family:var(--serif);font-size:20px;min-width:96px;text-align:right;padding-bottom:6px;font-variant-numeric:tabular-nums}
.vincl{flex-basis:100%;display:flex;gap:8px;align-items:center;font-size:13px;color:var(--muted);cursor:pointer}
.vincl input{accent-color:var(--accent)}
.w-s{width:150px}
.inv-row.att-row{grid-template-columns:20px minmax(0,1fr) auto 44px 70px}
.trello-head .btn{white-space:nowrap}
.att-row .av{font-size:12px;text-align:right}
.trello{max-width:700px;border:1px solid var(--rule);border-radius:8px;padding:14px 16px;margin-top:20px}
.trello-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:10px}
.trello pre{white-space:pre-wrap;font-family:var(--sans);font-size:13px;line-height:1.6;background:var(--bg);border-radius:6px;padding:10px 12px;margin:0;max-height:260px;overflow:auto}
.cd-row{display:grid;grid-template-columns:minmax(0,1fr) 120px auto;gap:8px;align-items:center;margin-bottom:8px;max-width:680px}
.cd-row .inp{max-width:none}
.calc{font-size:13px;color:var(--muted);padding-bottom:10px;min-width:150px}
.calc .bad,.bad{color:var(--err)}
.cons-row{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;padding:12px 0;border-bottom:1px solid var(--rule);max-width:700px}
.cons-row>div:first-child{flex:1 1 200px;min-width:0}
.cons-row small{display:block;font-size:13px;color:var(--muted)}
.cons-row .seg label{padding:5px 11px;font-size:13px}
.cons-row .cnt{flex-basis:100%;margin:0}
.vmodo{flex-basis:100%;display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center}
.vmodo .seg label{padding:5px 11px;font-size:13px}
.vnote{flex-basis:100%}
.vnote textarea.inp{min-height:64px;max-width:none}
.vint{flex-basis:100%;font-size:12px;color:var(--muted);margin:0;font-style:italic}
.kpi{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--rule);border:1px solid var(--rule);border-radius:8px;overflow:hidden;max-width:700px;margin:0 0 18px}
.kpi>div{background:var(--surface);padding:12px 14px}
.kpi small{display:block;font-size:12px;color:var(--muted)}
.kpi strong{display:block;font-family:var(--serif);font-size:22px;font-weight:500;line-height:1.25}
.kpi span{font-size:12px;color:var(--muted)}
.inv{max-width:700px}
.inv .grp{margin:18px 0 4px}
.inv-row{display:grid;grid-template-columns:20px minmax(0,1fr) auto 70px;gap:10px;align-items:center;padding:4px;min-height:44px;border-bottom:1px solid var(--rule);font-size:14px}
.inv-row input[type="checkbox"]{accent-color:var(--accent);width:16px;height:16px}
.inv-row label{cursor:pointer}
.inv-row .inp{min-height:34px;padding:5px 8px;max-width:70px}
.tot{margin:0;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:7px 0;font-size:14px}
.tot dd{padding-left:14px}
.tot dt{color:var(--muted)}
.tot dt small{display:block;font-size:12px}
.tot dd{margin:0;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tot .sep{border-top:1px solid var(--rule);padding-top:8px;color:var(--ink)}
.tot .grand{font-family:var(--serif);font-size:23px;color:var(--ink);border-top:1px solid var(--rule-strong);padding-top:8px;line-height:1.2}
.tot.big{max-width:460px;font-size:15px;margin-top:8px}
.fzbox{max-width:460px;margin-top:16px;border:1px solid var(--accent);background:var(--accent-soft);border-radius:8px;padding:12px 16px}
.fzbox small{display:block;font-size:12px;color:var(--muted)}
.fzbox strong{display:block;font-family:var(--serif);font-weight:500;font-size:22px}
.fzbox span{font-size:13px;color:var(--muted)}
.note.warn{border-left-color:var(--err)}
.prev{max-width:620px;border:1px solid var(--rule);border-radius:8px;padding:18px 20px;background:var(--bg);margin-top:20px}
.prev h4{font-family:var(--serif);font-weight:500;font-size:17px;color:var(--accent);margin:16px 0 6px}
.prev h4:first-of-type{margin-top:0}
.prev ul{list-style:none;margin:0;padding:0}
.prev li{display:flex;justify-content:space-between;gap:12px;padding:5px 0;border-bottom:1px solid var(--rule);font-size:14px}
.prev li span:last-child{color:var(--muted);text-align:right}
.prev sup{color:var(--accent);font-size:10px;margin-left:2px}
.prev .ptot{font-family:var(--serif);font-size:23px;margin-top:16px}
.prev .pnote{font-size:12px;color:var(--muted);margin-top:12px;line-height:1.5}
.steps.compact{gap:4px}
.steps.compact .lbl{font-size:12px}
.stato{min-height:32px;padding:4px 8px;font-size:13px;width:auto;max-width:130px}
.c-act{flex-wrap:wrap;justify-content:flex-end}

.mono{border:0!important}
.mono img{width:100%;height:100%;object-fit:contain;display:block}
.mono .logo-d{display:none}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .mono .logo-l{display:none}:root:not([data-theme="light"]) .mono .logo-d{display:block}}
:root[data-theme="dark"] .mono .logo-l{display:none}
:root[data-theme="dark"] .mono .logo-d{display:block}
/* Impostazioni */
.set-list{border-top:1px solid var(--rule)}
.set-row{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:16px;align-items:center;padding:12px 4px;border-bottom:1px solid var(--rule)}
.st-ok{color:var(--ok);font-size:14px}
.st-todo{color:var(--muted);font-size:14px}
.seg{display:inline-flex;border:1px solid var(--rule-strong);border-radius:6px;overflow:hidden}
.seg label{padding:8px 14px;cursor:pointer;font-size:14px}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label:has(input:checked){background:var(--accent);color:var(--accent-ink)}
.seg label:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:-2px}
.switch{display:inline-flex;align-items:center;gap:10px;cursor:pointer;font-size:14px}
.switch input{accent-color:var(--accent);width:18px;height:18px}
.block{border:1px solid var(--rule);border-radius:8px;padding:18px 20px;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}

/* Modale e avvisi */
.modal-back{position:fixed;inset:0;background:rgba(20,15,10,.45);display:grid;place-items:center;z-index:60;padding:16px}
.modal{background:var(--bg);border-radius:10px;padding:24px;max-width:500px;width:100%;border:1px solid var(--rule)}
.modal h2{margin-bottom:10px}
.modal p{margin:0 0 12px}
.modal .actions{justify-content:flex-end;margin-top:20px}
.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);opacity:0;background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:6px;font-size:14px;z-index:70;transition:opacity .2s,transform .2s;pointer-events:none;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* Mobile */
@media (max-width:760px){
  .app{grid-template-columns:1fr}
  .side{display:none}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
  .topbar{display:flex;align-items:center;gap:12px;position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--bg);border-bottom:1px solid var(--rule);padding:10px 16px}
  .topbar .mono{width:34px;height:34px;font-size:17px}
  .topbar .t{font-family:var(--serif);font-size:20px;flex:1}
  .topbar a{color:var(--muted);display:grid;place-items:center;width:40px;height:40px}
  .topbar a[aria-current="page"]{color:var(--accent)}
  .tabbar{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--bg);border-top:1px solid var(--rule);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
  .tabbar a{display:flex;flex-direction:column;align-items:center;gap:2px;text-decoration:none;color:var(--muted);font-size:11px;padding:4px 0;text-align:center;line-height:1.2}
  .tabbar a[aria-current="page"]{color:var(--accent)}
  main{padding:24px 18px 120px}
  h1{font-size:30px}
  .page-head{align-items:flex-start}
  .doc-row{grid-template-columns:minmax(0,1fr) auto;gap:10px}
  .c-main{flex-direction:column;gap:0}
  .c-date{display:none}
  .vbadge{grid-row:1;grid-column:2;justify-self:end}
  .c-act{grid-column:1/-1}
  details.versions{padding-left:4px}
  .vlist li{flex-direction:column;gap:0}
  body.in-wiz .tabbar{display:none}
  .wiz{grid-template-columns:1fr;gap:0}
  .steps .lbl{display:none}
  .steps .cur .lbl{display:block;overflow:visible}
  .field-q{font-size:24px}
  .wiz-foot{position:fixed;left:0;right:0;bottom:0;z-index:20;margin:0;background:var(--bg);padding:12px 18px calc(12px + env(safe-area-inset-bottom,0px))}
  .wiz-foot .btn{flex:1}
  .panel-toggle{display:inline-flex}
  .panel{position:fixed;left:0;right:0;bottom:0;top:auto;z-index:40;border-radius:14px 14px 0 0;max-height:75vh;overflow:auto;padding:20px 20px calc(20px + env(safe-area-inset-bottom,0px));transform:translateY(105%);transition:transform .25s;box-shadow:0 -8px 30px rgba(0,0,0,.18)}
  .panel.open{transform:none}
  .panel-close{display:inline-flex;float:right}
  .set-row{grid-template-columns:minmax(0,1fr) auto}
  .set-row .btn{grid-column:1/-1;justify-self:start}
  .toast{bottom:96px}
  .rate-row{grid-template-columns:20px 88px 14px minmax(0,1fr)}
  .w-u{width:100%}
  .vhead{flex-wrap:wrap}
  .vlist{flex-basis:100%;text-align:left;padding-left:28px;white-space:normal}
  .kpi{grid-template-columns:1fr}
  .inv-row{grid-template-columns:20px minmax(0,1fr) 64px}
  .inv-row>span.muted{display:none}
  .inv-row.att-row{grid-template-columns:20px minmax(0,1fr) 40px 64px}
  .att-row .av{display:block!important}
}
</style>

/* ---------- Numeri, importi, lettere ---------- */
const parseNum = s => { s = String(s ?? "").trim(); if (!s) return NaN; if (s.includes(",")) s = s.replace(/\./g,"").replace(",","."); return Number(s); };
const eur = n => n.toLocaleString("it-IT",{minimumFractionDigits:2, maximumFractionDigits:2}) + " €";
const pct = n => n.toLocaleString("it-IT",{maximumFractionDigits:2});
const fmtLong = iso => new Date(iso+"T12:00:00").toLocaleDateString("it-IT",{day:"numeric",month:"long",year:"numeric"});
function intIt(n){
  const u = ["zero","uno","due","tre","quattro","cinque","sei","sette","otto","nove","dieci","undici","dodici","tredici","quattordici","quindici","sedici","diciassette","diciotto","diciannove"];
  const d = ["","","venti","trenta","quaranta","cinquanta","sessanta","settanta","ottanta","novanta"];
  if (n < 20) return u[n];
  if (n < 100){ let t = d[Math.floor(n/10)]; const r = n % 10; if (r === 1 || r === 8) t = t.slice(0,-1); return t + (r ? u[r] : ""); }
  if (n < 1000){ const c = Math.floor(n/100), r = n % 100; let s = (c === 1 ? "" : u[c]) + "cento"; if (Math.floor(r/10) === 8) s = s.slice(0,-1); return s + (r ? intIt(r) : ""); }
  if (n < 1e6){ const m = Math.floor(n/1000), r = n % 1000; return (m === 1 ? "mille" : intIt(m) + "mila") + (r ? intIt(r) : ""); }
  const M = Math.floor(n/1e6), r = n % 1e6; return (M === 1 ? "unmilione" : intIt(M) + "milioni") + (r ? intIt(r) : "");
}
function lettere(v){
  const int = Math.floor(v + 1e-9), cent = Math.round((v - int) * 100);
  let s = intIt(int); if (s.length > 3 && s.endsWith("tre")) s = s.slice(0,-3) + "tré";
  return s + "/" + pad2(cent) + " euro";
}
const quandoTxt = (q, data) => q === "data" ? (data ? "entro il " + fmtLong(data) : "entro una data da indicare") : QUANDO_TXT[q];
function paySum(){
  const d = draft, tot = parseNum(d.totale);
  const sum = d.rate.reduce((a,r) => a + (parseNum(r.val) || 0), 0);
  const target = d.modo === "perc" ? 100 : tot;
  const ok = target > 0 && Math.abs(sum - target) < (d.modo === "perc" ? 0.01 : 0.005);
  return {sum, target, ok, diff: (target || 0) - sum};
}
const NUMW = ["","","due","tre","quattro","cinque","sei"];
function pagFrase(){
  const d = draft, tot = parseNum(d.totale);
  if (!(tot > 0)) return "Inserisci il compenso per vedere il testo.";
  const head = `Il compenso complessivo è di ${eur(tot)} (${lettere(tot)}), comprensivo di rivalsa INPS 4% e imposta di bollo. Operazione in regime forfettario, senza applicazione dell’IVA.`;
  if (!d.multi) return `${head} Il pagamento avverrà in un’unica soluzione ${quandoTxt(d.unicaQuando, d.unicaData)}.`;
  const items = d.rate.map(r => {
    const v = parseNum(r.val) || 0;
    const amt = d.modo === "perc" ? `${pct(v)}% (${eur(tot*v/100)})` : eur(v);
    return `${amt} ${quandoTxt(r.quando, r.data)}`;
  });
  return `${head} Il pagamento avverrà in ${NUMW[d.rate.length]} soluzioni: ${items.join("; ")}.`;
}

  if (!CD) return null;

  const r = CD.righe.reduce((a,x) => a + (parseNum(x.imp) || 0), 0) + (parseNum(CD.riv) || 0) + (parseNum(CD.bollo) || 0);
  const t = parseNum(CD.totale) || 0;
  return {sum:Math.round(r*100)/100, tot:t, ok: t > 0 && Math.abs(r - t) < 0.005};
}

function cdcValidate(){
  const d = CD;
  if (!/^\d+\/\d{4}$/.test(d.num.trim())) return "Il numero deve essere nella forma 42/2026.";
  if (!d.data) return "Indica la data della fattura.";
  if (!d.righe.length || d.righe.some(r => !r.desc.trim() || !(parseNum(r.imp) > 0))) return "Ogni riga deve avere descrizione e importo.";
  if (!cdcCheck().ok) return "La somma non torna con il totale: controlla i valori letti dal PDF.";
  if (!d.iban.trim()) return "Indica l’IBAN.";
  return "";
}
function cdcGenerate(){

}

    <div class="seg" role="radiogroup" aria-label="Tema">${[["auto","Automatico"],["light","Chiaro"],["dark","Scuro"]].map(([v,l]) => `<label><input type="radio" name="tema" value="${v}" data-setting="tema" ${t===v?"checked":""}>${l}</label>`).join("")}</div>
    <h2 class="section-gap">Diciture</h2>
    <label class="f"><span>Etichetta del 4% nei preventivi</span><input class="inp" value="${esc(lab)}" data-setting="label4"></label>
    <label class="f"><span>Maggiorazione su spese esterne, noleggi e spese rifatturate (%)</span><input class="inp num" inputmode="decimal" value="${esc(store.get("fm-magg","26"))}" data-setting="magg"></label>
    <label class="f"><span>Listino valido dal</span><input class="inp" type="date" value="${esc(store.get("fm-listino",""))}" data-setting="listino" style="max-width:200px"></label>
  </div>`;
}

/* ---------- Procedura guidata contratto ---------- */
const tog = (f, l, h) => `<label class="tog"><input type="checkbox" data-field="${f}" data-bool ${draft[f] ? "checked" : ""}><span><strong>${l}</strong>${h ? `<small>${h}</small>` : ""}</span></label>`;
const radio = (f, v, l, h) => `<label class="opt"><input type="radio" name="${f}" value="${v}" data-field="${f}" ${String(draft[f])===v ? "checked" : ""}><span><strong>${l}</strong>${h ? `<small>${h}</small>` : ""}</span></label>`;
const sel = (attrs, opts, cur) => `<select class="inp" ${attrs}>${opts.map(([v,l]) => `<option value="${v}" ${String(cur)===String(v) ? "selected" : ""}>${l}</option>`).join("")}</select>`;

function rateHTML(){
  const d = draft, unit = d.modo === "perc" ? "%" : "€";
  return d.rate.map((r,i) => `<div class="rate-row">
      <span class="rn">${i+1}</span>
      <input class="inp" inputmode="decimal" data-rate="${i}" data-k="val" value="${esc(r.val)}" aria-label="Importo soluzione ${i+1}">
      <span>${unit}</span>
      ${sel(`data-rate="${i}" data-k="quando" aria-label="Quando"`, QUANDO, r.quando)}
      <div class="extra">${r.quando === "data" ? `<input class="inp" type="date" data-rate="${i}" data-k="data" value="${esc(r.data)}" aria-label="Data" style="max-width:180px">` : ""}<span class="conv" data-conv="${i}"></span></div>
    </div>`).join("");
}

function stepHTML(){
  const d = draft, c = d.cli ? cliente(d.cli) : null;
  switch (STEPS[d.step].id){
    case "cliente": return `<h2 class="field-q">Per quale cliente?</h2><p class="hint">L’elenco arriva dal foglio Clienti.</p>
      ${CLIENTI.map(x => radio("cli", x.id, esc(x.nome), `${x.id}, ${x.tipo.toLowerCase()}`)).join("")}
      ${c && c.tipo==="Privato" ? `<div class="note">Cliente privato: nel contratto si applica in automatico il foro del consumatore.</div>` : ""}
      ${c && c.tipo==="Azienda" ? `<label class="f" style="margin-top:18px"><span>Chi firma per l’azienda</span><input class="inp" data-field="firmatario" value="${esc(d.firmatario)}" placeholder="Nome e cognome"></label>` : ""}`;

    case "lavoro": return `<h2 class="field-q">Di che lavoro si tratta?</h2><p class="hint">Il titolo finisce nel nome del file, l’oggetto e le fasi nel contratto.</p>
      <label class="f"><span>Titolo del progetto</span><input class="inp" data-field="titolo" value="${esc(d.titolo)}" placeholder="Es. Videocorso ADHD"></label>
      <label class="f"><span>Oggetto del contratto</span><textarea class="inp" data-field="oggetto" placeholder="Es. Riprese e montaggio con grafiche di pillole video per un corso di formazione.">${esc(d.oggetto)}</textarea></label>
      <div class="f"><span style="display:block;font-size:13px;font-weight:500;margin-bottom:6px">Fasi del progetto</span>
        ${d.fasi.map((f,i) => `<div class="fase-row"><input class="inp" data-fase="${i}" value="${esc(f)}" placeholder="Es. Riprese con doppia camera" aria-label="Fase ${i+1}">
          <button class="btn small" data-action="fase-up" data-i="${i}" ${i===0 ? "disabled" : ""} aria-label="Sposta su">Su</button>
          <button class="btn small" data-action="fase-del" data-i="${i}" aria-label="Rimuovi fase">Togli</button></div>`).join("")}
        <button class="btn small" data-action="fase-add" style="margin-top:4px">Aggiungi fase</button></div>
      <label class="f"><span>Data delle riprese (facoltativa)</span><input class="inp" type="date" data-field="data" value="${esc(d.data)}"></label>
      <label class="f"><span>Luogo (facoltativo)</span><input class="inp" data-field="luogo" value="${esc(d.luogo)}" placeholder="Es. Torino"></label>`;

    case "tempi": return `<h2 class="field-q">Tempi e modifiche</h2><p class="hint">Entrambi facoltativi: se li lasci spenti, nel contratto non compaiono.</p>
      ${tog("consegnaOn","Indica i tempi di consegna","Stima in giorni lavorativi")}
      ${d.consegnaOn ? `<div class="sub"><label class="f"><span>Giorni lavorativi</span><input class="inp num" type="number" min="1" data-field="consegnaGiorni" value="${esc(d.consegnaGiorni)}"></label>
        <label class="f"><span>A partire da</span>${sel(`data-field="consegnaDa"`, [["riprese","Fine delle riprese"],["materiale","Ricezione del materiale del cliente"]], d.consegnaDa)}</label></div>` : ""}
      ${tog("modificheOn","Indica il numero di modifiche incluse","Giri di revisione su ciascun prodotto finito")}
      ${d.modificheOn ? `<div class="sub"><label class="f"><span>Modifiche incluse</span><input class="inp num" type="number" min="0" data-field="modificheN" value="${esc(d.modificheN)}"></label></div>` : ""}`;

    case "materiale": return `<h2 class="field-q">Girato e materiale</h2><p class="hint">Attiva solo le clausole che servono a questo lavoro.</p>
      ${tog("grezzo","Il girato grezzo non è incluso","Il cliente riceve solo il prodotto finito")}
      ${tog("h24","Consegna entro 24 ore dall’evento","Per eventi con consegna rapida")}
      ${tog("materialeOn","Il cliente deve fornirmi del materiale","Loghi, musiche, testi, grafiche")}
      ${d.materialeOn ? `<div class="sub"><label class="f"><span>Entro quanti giorni dalla firma</span><input class="inp num" type="number" min="1" data-field="materialeGiorni" value="${esc(d.materialeGiorni)}"></label></div>` : ""}`;

    case "compenso": {
      const s = d.multi ? paySum() : null;
      return `<h2 class="field-q">Compenso e pagamento</h2><p class="hint">Importo che il cliente paga in totale, rivalsa e bollo compresi.</p>
      <label class="f"><span>Compenso totale (€)</span><input class="inp num" inputmode="decimal" data-field="totale" value="${esc(d.totale)}" placeholder="0,00"><div class="lettere" id="lettere"></div></label>
      ${tog("multi","Pagamento in più soluzioni","Se è spento, il pagamento è in un’unica soluzione")}
      ${!d.multi ? `<div class="sub"><label class="f"><span>Quando</span>${sel(`data-field="unicaQuando"`, QUANDO, d.unicaQuando)}</label>
          ${d.unicaQuando === "data" ? `<label class="f"><span>Data</span><input class="inp" type="date" data-field="unicaData" value="${esc(d.unicaData)}" style="max-width:200px"></label>` : ""}</div>`
      : `<div class="sub">
          <label class="f"><span>Numero di soluzioni</span>${sel(`data-field="nRate" style="max-width:120px"`, [2,3,4,5,6].map(n => [n,n]), d.rate.length)}</label>
          <div class="seg" role="radiogroup" aria-label="Modalità" style="margin-bottom:14px">${[["perc","In percentuale"],["euro","In euro"]].map(([v,l]) => `<label><input type="radio" name="modo" value="${v}" data-field="modo" ${d.modo===v?"checked":""}>${l}</label>`).join("")}</div>
          ${rateHTML()}
          <div class="check" id="check"></div>
          <button class="btn small" data-action="resto">Assegna il resto all’ultima</button>
        </div>`}
      <label class="f" style="margin-top:20px"><span>Conto per il bonifico</span>${sel(`data-field="conto" style="max-width:240px"`, CONTI, d.conto)}</label>
      <div class="frase"><small>Testo nel contratto (bozza)</small><p id="frase"></p></div>`;
    }

    case "trasporti": return `<h2 class="field-q">Spese di trasferta e servizi esterni</h2><p class="hint">Scrivi le spese in minuscolo, separate da virgole (es. viaggio, alloggio). Lascia vuoto quello che non serve: se è tutto vuoto, il contratto dice che non ci sono spese a carico del cliente.</p>
      <label class="f"><span>Comprese nel compenso</span><input class="inp" data-field="speseIncluse" value="${esc(d.speseIncluse)}" placeholder="Es. viaggio e vitto"></label>
      <label class="f"><span>A consuntivo, fatturate dai fornitori al cliente</span><input class="inp" data-field="speseFornitori" value="${esc(d.speseFornitori)}" placeholder="Es. alloggio, noleggio di attrezzatura"></label>
      <label class="f"><span>A consuntivo, anticipate da me e rimborsate</span><input class="inp" data-field="speseAnticipate" value="${esc(d.speseAnticipate)}" placeholder="Es. permessi"></label>
      <div class="frase"><small>Testo nel contratto, Punto 6</small><p id="fraseSpese"></p></div>`;

    case "licenza": return `<h2 class="field-q">Licenza d’uso</h2><p class="hint">Gli adattamenti di formato sono sempre consentiti.</p>
      ${radio("licenza","non","Non esclusiva","Il cliente usa il video negli ambiti scelti, i diritti restano a me")}
      ${radio("licenza","escl","Esclusiva","Il cliente acquisisce i diritti di sfruttamento economico")}
      <h3 class="grp">Dove potrà usarlo</h3>
      ${USI.map(([k,l]) => `<label class="opt"><input type="checkbox" value="${k}" data-field="usi" ${d.usi.includes(k)?"checked":""}><span>${l}</span></label>`).join("")}
      <label class="f" style="margin-top:12px"><span>Altro (facoltativo)</span><input class="inp" data-field="usiAltro" value="${esc(d.usiAltro)}" placeholder="Es. piattaforme di formazione online"></label>
      <h3 class="grp">Altre condizioni</h3>
      ${tog("portfolio","Posso usare il lavoro nel mio portfolio")}
      ${tog("citazione","Il cliente cita il mio nome come autore","Dove il formato lo permette")}
      ${tog("musicaOn","Uso musiche di repertorio","Indica la libreria: la sua licenza deve coprire gli usi scelti sopra")}
      ${d.musicaOn ? `<div class="sub"><label class="f"><span>Libreria e piano</span><input class="inp" data-field="musica" value="${esc(d.musica)}" placeholder="Es. Artlist, piano Pro"></label></div>` : ""}`;

    case "foro": return c && c.tipo === "Privato"
      ? `<h2 class="field-q">Foro competente</h2><div class="note">${esc(c.nome)} è un cliente privato: si applica il foro del consumatore, cioè quello del suo luogo di residenza. Non c’è niente da scegliere.</div>`
      : `<h2 class="field-q">Foro competente</h2><p class="hint">Dove si discute un’eventuale controversia.</p>
        ${Object.entries(FORO).map(([k,[l,h]]) => radio("foro", k, l, h)).join("")}`;

    case "riepilogo": {
      const e = d.edit, doc = e ? DOCS.find(x => x.code===e.code && x.tipo==="CTR") : null;
      const code = e ? e.code : ctrCode(d);
      const v = doc ? doc.versions.length + 1 : 1;
      const name = fnameRaw(code,"CTR",d.cli,d.titolo,v);
      const folderExists = DOCS.some(x => x.tipo==="CTR" && x.cli===d.cli);
      return `<h2 class="field-q">Controlla e genera</h2><p class="hint">Puoi tornare a qualsiasi passo dalla barra in alto.</p>
        ${summaryHTML()}
        <div class="frase"><small>Pagamento (bozza)</small><p id="frase"></p></div>
        <div class="out">
          <p><strong>Cartella</strong><br>Archivio contratti / ${c.id} – ${esc(c.nome)} <span class="muted">(${folderExists ? "esiste già" : "verrà creata"})</span></p>
          <p><strong>File</strong><br><span class="fname">${esc(name)}</span> <span class="muted">(Google Doc)</span><br><span class="fname">${esc(name)}.pdf</span></p>

}

function summaryHTML(){
  const d = draft, c = d.cli ? cliente(d.cli) : null, tot = parseNum(d.totale);
  const dash = `<span class="muted">–</span>`;
  const mat = [d.grezzo && "Grezzo escluso", d.h24 && "Consegna in 24 ore", d.materialeOn && `Materiale entro ${d.materialeGiorni} gg`].filter(Boolean);
  return `<dl class="sum">
    <dt>Cliente</dt><dd>${c ? esc(c.nome) : dash}</dd>
    ${c && c.tipo==="Azienda" ? `<dt>Firmatario</dt><dd>${d.firmatario ? esc(d.firmatario) : dash}</dd>` : ""}
    <dt>Lavoro</dt><dd>${d.titolo ? esc(d.titolo) : dash}</dd>
    <dt>Riprese</dt><dd>${d.data ? fmtDate(d.data) : dash}${d.luogo ? ", "+esc(d.luogo) : ""}</dd>
    <dt>Fasi</dt><dd>${d.fasi.filter(f => f.trim()).length || dash}</dd>
    <dt>Consegna</dt><dd>${d.consegnaOn ? `${esc(d.consegnaGiorni)} gg lav. ${d.consegnaDa==="riprese" ? "dalle riprese" : "dal materiale"}` : "Non indicata"}</dd>
    <dt>Modifiche</dt><dd>${d.modificheOn ? esc(d.modificheN) : "Non indicate"}</dd>
    <dt>Materiale</dt><dd>${mat.length ? mat.join(", ") : dash}</dd>
    <dt>Compenso</dt><dd>${tot > 0 ? eur(tot) : dash}${tot > 0 ? (d.multi ? `, in ${d.rate.length} soluzioni` : ", unica soluzione") : ""}</dd>
    <dt>Spese</dt><dd>${[d.speseIncluse.trim() && "incluse: "+esc(d.speseIncluse.trim()), d.speseFornitori.trim() && "dai fornitori: "+esc(d.speseFornitori.trim()), d.speseAnticipate.trim() && "anticipate: "+esc(d.speseAnticipate.trim())].filter(Boolean).join("; ") || "Nessuna"}</dd>
    <dt>Licenza</dt><dd>${d.licenza === "escl" ? "Esclusiva" : "Non esclusiva"}${(() => { const u = USI.filter(([k]) => d.usi.includes(k)).map(([,l]) => l.toLowerCase()); if (d.usiAltro.trim()) u.push(esc(d.usiAltro.trim())); return u.length ? ": "+u.join(", ") : ""; })()}</dd>
    <dt>Musiche</dt><dd>${d.musicaOn ? (d.musica ? esc(d.musica) : "Da indicare") : "Non indicate"}</dd>
    <dt>Foro</dt><dd>${c ? (c.tipo==="Privato" ? "Del consumatore" : FORO[d.foro][0]) : dash}</dd>
  </dl>`;
}

function panelHTML(){
  return `<button class="btn small panel-close" data-action="panel">Chiudi</button><h3>Riepilogo</h3>${summaryHTML()}
    ${draft.saved ? `<div class="saved">Bozza salvata alle ${new Date(draft.saved).toLocaleTimeString("it-IT",{hour:"2-digit",minute:"2-digit"})}</div>` : ""}`;
}

function live(){
  const d = draft, tot = parseNum(d.totale);
  const l = $("#lettere"); if (l) l.textContent = tot > 0 ? lettere(tot) : "";
  const f = $("#frase"); if (f) f.textContent = pagFrase();
  const fs = $("#fraseSpese"); if (fs) fs.textContent = speseFrase(d);
  const ch = $("#check");
  if (ch && d.multi){
    const s = paySum(), isP = d.modo === "perc";
    const fmt = n => isP ? pct(n)+"%" : eur(n);
    if (!isP && !(tot > 0)){ ch.className = "check bad"; ch.textContent = "Inserisci prima il compenso totale."; }
    else {
      ch.className = "check " + (s.ok ? "ok" : "bad");
      ch.textContent = `Somma: ${fmt(s.sum)} su ${fmt(s.target)}` + (s.ok ? ". I conti tornano." : s.diff > 0 ? `. Mancano ${fmt(s.diff)}.` : `. Hai superato di ${fmt(-s.diff)}.`);
    }
    document.querySelectorAll("[data-conv]").forEach(el => {
      const v = parseNum(d.rate[+el.dataset.conv].val);
      el.textContent = !(v > 0) || !(tot > 0) ? "" : isP ? "= " + eur(tot*v/100) : "= " + pct(v/tot*100) + "%";
    });
  }
}

function wizard(){
  if (!draft) draft = DEF();
  const d = draft, last = d.step === STEPS.length - 1;
  return `<div class="wiz"><div class="wiz-main">
    <a class="wiz-back" href="#contratti">‹ Contratti</a>
    <div class="wiz-title"><h1>${d.edit ? "Modifica contratto "+d.edit.code : "Nuovo contratto"}</h1><button class="btn small panel-toggle" data-action="panel">Riepilogo</button></div>
    ${d.rifPrv && !d.edit ? `<div class="note" style="margin-bottom:18px">Precompilato dal preventivo ${d.rifPrv}: controlla ogni passo prima di andare avanti.</div>` : ""}
    <ol class="steps">${STEPS.map((s,i) => `<li class="${i===d.step ? "cur" : i<=d.max ? "done" : ""}"><button data-action="goto" data-i="${i}" ${i>d.max ? "disabled" : ""} ${i===d.step ? 'aria-current="step"' : ""}><span class="n">${i+1}</span><span class="lbl">${s.label}</span></button></li>`).join("")}</ol>
    <section id="stepBody">${stepHTML()}</section>
    <div class="err" id="err" role="alert"></div>
    <div class="wiz-foot">
      <button class="btn" data-action="prev" ${d.step===0 ? "disabled" : ""}>Indietro</button>
      ${last ? `<button class="btn primary" data-action="generate">${d.edit ? "Salva nuova versione" : "Genera contratto"}</button>` : `<button class="btn primary" data-action="next">Avanti</button>`}
    </div>
  </div><aside class="panel" id="panel" aria-label="Riepilogo">${panelHTML()}</aside></div>`;
}

function validate(){
  const d = draft, id = STEPS[d.step].id;
  if (id === "cliente" && !d.cli) return "Scegli un cliente per continuare.";
  if (id === "cliente" && cliente(d.cli).tipo === "Azienda" && !d.firmatario.trim()) return "Indica chi firma per l’azienda.";
  if (id === "lavoro"){
    if (!d.titolo.trim()) return "Scrivi il titolo del progetto.";
    if (!d.oggetto.trim()) return "Descrivi l’oggetto del contratto.";
  }
  if (id === "tempi"){
    if (d.consegnaOn && !(+d.consegnaGiorni > 0)) return "Indica i giorni di consegna, oppure spegni l’opzione.";
    if (d.modificheOn && !(+d.modificheN >= 0 && d.modificheN !== "")) return "Indica il numero di modifiche, oppure spegni l’opzione.";
  }
  if (id === "materiale" && d.materialeOn && !(+d.materialeGiorni > 0)) return "Indica entro quanti giorni il cliente invia il materiale.";
  if (id === "compenso"){
    if (!(parseNum(d.totale) > 0)) return "Inserisci il compenso totale.";
    if (!d.multi && d.unicaQuando === "data" && !d.unicaData) return "Indica la data del pagamento.";
    if (d.multi){
      if (d.rate.some(r => !(parseNum(r.val) > 0))) return "Compila l’importo di ogni soluzione.";
      if (d.rate.some(r => r.quando === "data" && !r.data)) return "Indica la data delle soluzioni con scadenza.";
      if (!paySum().ok) return d.modo === "perc" ? "Le percentuali devono fare 100%." : "La somma delle soluzioni deve essere uguale al compenso totale.";
    }
  }
  if (id === "licenza" && !d.usi.length && !d.usiAltro.trim()) return "Scegli almeno un uso, oppure scrivilo in Altro.";
  if (id === "licenza" && d.musicaOn && !d.musica.trim()) return "Indica la libreria musicale, oppure spegni l’opzione.";
  return "";
}

  return {on:true, unita:u, qta: days ? String(defDays()) : "1", ris:"1", prezzo: p != null ? String(p) : "", importo:"", nota: s.nota && !s.obbl ? s.nota : "", modo:"tot", stima:"", esterna:!!s.est, costo:"", cifra:""};
}
function vImp(v){
  if (!v || !v.on || vm(v) !== "tot") return 0;
  if (v.esterna){ const c = parseNum(v.cifra); return c > 0 ? c : espCalc(v); }
  if (v.unita === "Forfait") return parseNum(v.importo) || 0;
  const q = parseNum(v.qta) || 0, r = v.unita === "Fisso" ? 1 : (parseNum(v.ris) || 0), p = parseNum(v.prezzo) || 0;
  return Math.round(q * r * p * 100) / 100;
}
function listaVal(){
  return INV.reduce((a, it) => { const x = qd.items[it.id]; if (!x) return a; return a + (parseNum(x.qta) || 0) * (qd.attUnit === "m" ? (it.m ?? it.g) : it.g); }, 0);
}
function att(){
  const d = qd, days = attDays();
  if (d.attMode === "none") return {on:false, total:0};
  if (d.attMode === "livello"){
    const l = KIT.find(x => String(x.n) === String(d.attLivello)) || KIT[0];
    return {on:true, level:l, perDay:kitPrice(l), days, total:kitPrice(l)*days, label:"Kit "+l.nome, cli:"Kit "+l.nome};
  }
  if (!Object.keys(d.items).length) return {on:false, total:0, empty:true};
  const val = listaVal(), top = KIT[KIT.length-1], auto = KIT.find(l => val <= soglia(l)) || null;
  if (d.listaMode === "pezzi") return {on:true, val, auto, pezzi:true, perDay:val, days, total:val*days, label:"A pezzi", cli:"come da lista allegata"};
  let l = d.override === "auto" ? auto : KIT.find(x => String(x.n) === String(d.override));
  let perDay, over = false, label, cliL;
  if (!l){
    over = true;
    if (d.tetto === "l3"){ l = top; perDay = kitPrice(top) + (val - soglia(top)); label = `Kit ${top.nome} + eccedenza`; cliL = "Kit "+top.nome+" e materiale aggiuntivo"; }
    else { perDay = parseNum(d.tettoPrezzo) || 0; label = "Prezzo a mano"; cliL = "come da lista allegata"; }
  } else { perDay = kitPrice(l); label = cliL = "Kit "+l.nome; }
  return {on:true, val, auto, level:l, over, perDay, days, total:perDay*days, label, cli:cliL};
}
function fiscozen(T){
  if (!(T > 0)) return null;
  const base = Math.round(T / 1.04); let below = null, above = null;
  for (let c = base - 400; c <= base + 400; c++){
    if (c <= 0) continue;
    const r = Math.round(c * 0.04), im = c + r, b = im > 7747 ? 200 : 0, t = im + b;
    if (t === T) return {ok:true, C:c, riv:r, b};
    if (t < T && (below === null || t > below)) below = t;
    if (t > T && (above === null || t < above)) above = t;
  }
  return {ok:false, below, above};
}
function qTot(){
  const fasi = {pre:0, prod:0, post:0};
  Object.entries(qd.voci).forEach(([id,v]) => { fasi[faseOf(id,v)] += vImp(v); });
  const a = att(), nol = (qd.noleggi || []).reduce((x,n) => x + nolImp(n), 0);
  const S = cents(fasi.pre + fasi.prod + fasi.post + (a.total || 0) + nol);
  const riv = Math.round(S * 0.04), imp = S + riv, bollo = imp > 7747 ? 200 : 0, calc = imp + bollo;
  const want = qd.noRound || !(parseNum(qd.cifra) > 0) ? calc : cents(parseNum(qd.cifra));
  return {fasi, a, nol, S, riv, bollo, calc, want, arr: calc - want, fz: S > 0 ? fiscozen(want) : null};
}

function qValidate(id){
  const d = qd;
  if (id === "cliente" && !d.cli) return "Scegli un cliente per continuare.";
  if (id === "progetto"){
    if (!d.titolo.trim()) return "Scrivi il titolo del progetto.";
    if (!d.dataPrev) return "Indica la data del preventivo.";
    if (!(parseNum(d.validita) > 0)) return "Indica per quanti giorni vale il preventivo.";
  }
  if (id === "pre" || id === "prod" || id === "post"){
    for (const [vid, v] of Object.entries(d.voci)){
      if (!v.on || faseOf(vid, v) !== id) continue;
      const s = srv(vid), name = s ? s.nome : (v.nome.trim() || "Voce libera");
      if (!s && !v.nome.trim()) return "Dai un nome alla voce libera, oppure toglila.";
      if (vm(v) === "tot" && v.esterna){ if (!(parseNum(v.costo) > 0) && !(parseNum(v.cifra) > 0)) return `${name}: scrivi il costo IVA inclusa.`; }
      else if (vm(v) === "tot"){
        if (v.unita === "Forfait"){ if (!(parseNum(v.importo) > 0)) return `${name}: scrivi l’importo, oppure scegli Inclusa o A consuntivo.`; }
        else if (!(parseNum(v.qta) > 0) || !(parseNum(v.prezzo) > 0) || (v.unita !== "Fisso" && !(parseNum(v.ris) >= 1)))
          return `${name}: compila ${v.unita === "Fisso" ? "quantità e prezzo" : "quantità, risorse e prezzo"}.`;
      }
      if (s && s.obbl && !v.nota.trim()) return `${name}: compila la nota a piè di pagina, è obbligatoria.`;
    }
  }
  if (id === "att" && d.attMode !== "none" && !(attDays() > 0)) return "Indica per quanti giorni serve l’attrezzatura.";
  if (id === "att"){ for (const n of d.noleggi){ if (!n.desc.trim()) return "Noleggio esterno: scrivi cosa e da quale noleggio."; if (!(parseNum(n.prezzo) > 0)) return `Noleggio esterno (${n.desc.trim()}): scrivi il prezzo IVA esclusa.`; } }
  if (id === "lista"){
    if (!Object.keys(d.items).length) return "Spunta almeno un articolo, oppure torna indietro e scegli un’altra opzione.";
    if (Object.values(d.items).some(x => !(parseNum(x.qta) > 0))) return "Ogni articolo spuntato deve avere una quantità.";
    const a = att(); if (a.over && d.tetto === "mano" && !(parseNum(d.tettoPrezzo) > 0)) return "Scrivi il prezzo dell’attrezzatura.";
  }
  if (id === "cond"){
    if (d.accontoOn){ const p = parseNum(d.accontoPerc); if (!(p > 0 && p < 100)) return "L’acconto deve essere tra 1 e 99%."; }
    if (d.revOn && !(d.revN !== "" && +d.revN >= 0)) return "Indica il numero di revisioni, oppure spegni l’opzione.";
    if (d.consOn && !(+d.consGiorni > 0)) return "Indica i giorni di consegna, oppure spegni l’opzione.";
  }
  if (id === "totale"){
    if (!(qTot().S > 0)) return "Il preventivo è vuoto: aggiungi almeno una voce.";
    if (!d.noRound && !(parseNum(d.cifra) > 0)) return "Scrivi la cifra finale, oppure attiva “Nessun arrotondamento”.";
  }
  return "";
}

function qLive(){

  document.querySelectorAll("[data-nimp]").forEach(el => { const n = qd.noleggi[+el.dataset.nimp]; if (n) el.textContent = n.paga === "cliente" ? (parseNum(n.prezzo) > 0 ? eur(parseNum(n.prezzo)) + " + IVA" : "+ IVA") : eur(nolImp(n)); });
  const tc = $("#titCount");
  if (tc){ const s = slug(qd.titolo); tc.textContent = s ? `Nel nome del file: ${s.slice(0,32)}${s.length > 32 ? ` (tagliato, ${s.length} caratteri su 32)` : ` (${s.length}/32)`}` : ""; }
  const dh = $("#dateHint");
  if (dh){ const n = qd.date.filter(Boolean).length; dh.textContent = n ? `${n} ${n === 1 ? "data" : "date"}: le voci a giornata in Produzione e i giorni di attrezzatura partono da ${n}.` : "Senza date, le voci a giornata partono da 1."; }
  const ls = $("#listaSum"); if (ls) ls.innerHTML = listaSumHTML();
  const tb = $("#tettoBox");
  if (tb){ const ov = String(!!att().over); if (tb.dataset.over !== ov || (ov === "true" && !tb.contains(document.activeElement))){ tb.dataset.over = ov; tb.innerHTML = tettoHTML(); } }
  const t = qTot();
  const ah = $("#accHint"); if (ah){ const p = parseNum(qd.accontoPerc); ah.textContent = p > 0 ? `= ${eur(t.want * p / 10000)} sul totale` : ""; }
  const tot = $("#totBox"); if (tot && !tot.contains(document.activeElement)) tot.innerHTML = totBoxHTML();
  const pv = $("#prevBox"); if (pv) pv.innerHTML = previewHTML();
  const p = $("#panel"); if (p) p.innerHTML = qPanel();
  const pt = $("#ptog"); if (pt) pt.textContent = "Totale " + eur(t.want/100);
}
function qRerender(focusSel){

const QRR = ["cli","attMode","attUnit","attLivello","override","tetto","listaMode","accontoOn","revOn","consOn","noRound","dettOn","genAtt"];
function qField(el){
  const d = qd; if (!d) return;
  let rr = false, focus = null;
  if (el.dataset.qv !== undefined){
    const id = el.dataset.qv, k = el.dataset.k;
    if (k === "on"){ if (el.checked) d.voci[id] = newVoce(id); else delete d.voci[id]; rr = true; focus = `[data-qv="${id}"][data-k="on"]`; }
    else {
      const v = d.voci[id]; if (!v) return;
      if (k === "unita"){
        v.unita = el.value; const s = srv(id);
        if (s){ const p = unitPrice(s, v.unita); v.prezzo = p != null ? String(p) : ""; if ((v.unita === "Giornata" || v.unita === "Mezza giornata") && s.fase === "prod") v.qta = String(defDays()); }
        rr = true; focus = `[data-qv="${id}"][data-k="unita"]`;
      } else if (k === "esterna"){ v.esterna = el.checked; rr = true; focus = `[data-qv="${id}"][data-k="esterna"]`; }
      else if (k === "fatt"){ v.fatt = el.value; rr = true; focus = `[data-qv="${id}"][data-k="fatt"][value="${el.value}"]`; }
      else if (k === "modo"){ v.modo = el.value; delete v.incl; rr = true; focus = `[data-qv="${id}"][data-k="modo"][value="${el.value}"]`; }
      else v[k] = el.value;
    }
  } else if (el.dataset.qitem !== undefined){
    const id = el.dataset.qitem, k = el.dataset.k;
    if (k === "on"){ if (el.checked) d.items[id] = {qta:"1"}; else delete d.items[id]; rr = true; focus = `[data-qitem="${id}"][data-k="on"]`; }
    else if (d.items[id]) d.items[id].qta = el.value;
  } else if (el.dataset.qn !== undefined){
    const n = d.noleggi[+el.dataset.qn]; if (!n) return;
    n[el.dataset.k] = el.value;
    if (el.dataset.k === "paga"){ rr = true; focus = `[data-qn="${el.dataset.qn}"][data-k="paga"][value="${el.value}"]`; }
  } else if (el.dataset.qdate !== undefined){ d.date[+el.dataset.qdate] = el.value; }
  else {
    const f = el.dataset.q; d[f] = el.hasAttribute("data-bool") ? el.checked : el.value;
    if (QRR.includes(f)){ rr = true; focus = el.type === "radio" ? `[data-q="${f}"][value="${el.value}"]` : `[data-q="${f}"]`; }
  }
  qSave();
  const e = $("#err"); if (e) e.textContent = "";
  if (rr) qRerender(focus); else qLive();
}
function qGenerate(){
  const d = qd;
  for (const [id] of qSteps()){
    const m = qValidate(id);
    if (m){ d.step = id; if (!d.visited.includes(id)) d.visited.push(id); qSave(); route(); $("#err").textContent = m; return; }
  }
  const data = JSON.parse(JSON.stringify(d)); ["step","visited","edit","saved","cli","titolo"].forEach(k => delete data[k]);
  let code;
  if (d.edit){
    const doc = DOCS.find(x => x.code === d.edit.code && x.tipo === "PRV");
    Object.assign(doc, {cli:d.cli, titolo:d.titolo, data}); doc.versions.push(today()); code = doc.code;
    toast(`Salvato come V${pad2(doc.versions.length)}`);
  } else {
    code = nextCode();
    DOCS.push({code, tipo:"PRV", cli:d.cli, titolo:d.titolo, versions:[today()], data, stato:"Bozza"});
    toast("Preventivo generato");
  }
  if (d.attMode === "lista" && d.genAtt){
    const at = DOCS.find(x => x.code === code && x.tipo === "ATT");
    if (at) at.versions.push(today()); else DOCS.push({code, tipo:"ATT", cli:d.cli, titolo:d.titolo, versions:[today()]});
  }
  qd = null; store.del(QKEY); location.hash = "preventivi";
}
function qClick(act, a){
  const d = qd; if (!d) return;
  const st = qSteps().map(s => s[0]), i = st.indexOf(d.step);
  if (act === "q-goto"){ const id = a.dataset.id; if (d.visited.includes(id) || id === d.step){ d.step = id; qSave(); route(); } return; }
  if (act === "q-prev"){ if (i > 0){ d.step = st[i-1]; qSave(); route(); } return; }
  if (act === "q-next"){
    const m = qValidate(d.step); if (m){ $("#err").textContent = m; return; }
    d.step = st[i+1]; if (!d.visited.includes(d.step)) d.visited.push(d.step); qSave(); route(); return;
  }

const aDays = () => parseNum(ad.giorni !== "" ? ad.giorni : aDefDays()) || 0;

function aTot(){
  const g = aDays();
  const perDay = INV.reduce((s,it) => { const x = ad.items[it.id]; return x ? s + (parseNum(x.qta) || 0) * (it.n || 0) : s; }, 0);
  const sub = Math.round(perDay * g * 100) / 100, sc = scontoPerc(g), disc = Math.round(sub * sc) / 100;
  const S = cents(sub - disc), riv = Math.round(S * 0.04), imp = S + riv, bollo = imp > 7747 ? 200 : 0, calc = imp + bollo;

function aValidate(id){

      if (dayDiff(d.ritiro, d.riconsegna) < 0) return "La riconsegna non può essere prima del ritiro.";
      if (!(aDays() > 0)) return "Indica i giorni di noleggio.";
    } else if (!d.titolo.trim()) return "Scrivi il titolo del lavoro.";
  }
  if (id === "articoli"){
    if (!Object.keys(d.items).length && !d.noleggi.length) return "Spunta almeno un articolo.";
    for (const [iid, x] of Object.entries(d.items)){
      const it = invItem(iid), q = parseNum(x.qta);
      if (!(q > 0)) return `${it.nome}: indica la quantità.`;

    }
    if (d.noleggi.some(n => !n.nome.trim())) return "Noleggio esterno: scrivi il nome dell’articolo, oppure toglilo.";
  }
  if (id === "totale" && !d.noRound && !(parseNum(d.cifra) > 0)) return "Scrivi la cifra finale, oppure attiva “Nessun arrotondamento”.";
  return "";
}
function aStepsBar(){
