    return `<li class="${id === ad.step ? "cur" : vis ? "done" : ""}"><button data-action="a-goto" data-id="${id}" ${!vis && id !== ad.step ? "disabled" : ""} ${id === ad.step ? 'aria-current="step"' : ""}><span class="n">${i+1}</span><span class="lbl">${ASTEP_L[id]}</span></button></li>`; }).join("");
}
function aWizard(){
  if (!ad) ad = ADEF();
  if (!aSteps().includes(ad.step)) ad.step = "articoli";
  const st = aSteps(), i = st.indexOf(ad.step), last = i === st.length - 1;
  return `<div class="wiz"><div class="wiz-main">
    <a class="wiz-back" href="#attrezzatura">‹ Attrezzatura</a>
    <div class="wiz-title"><h1>${ad.edit ? "Modifica lista " + ad.edit.code : "Nuova lista attrezzatura"}</h1><button class="btn small panel-toggle" data-action="panel">Riepilogo</button></div>
    <ol class="steps" id="asteps">${aStepsBar()}</ol>
    <section id="stepBody">${aStepHTML()}</section>
    <div class="err" id="err" role="alert"></div>
    <div class="wiz-foot">
      <button class="btn" data-action="a-prev" ${i === 0 ? "disabled" : ""}>Indietro</button>
      ${last ? `<button class="btn primary" data-action="a-generate">${ad.edit ? "Salva nuova versione" : "Genera lista"}</button>` : `<button class="btn primary" data-action="a-next">Avanti</button>`}
    </div>
  </div><aside class="panel" id="panel" aria-label="Riepilogo">${aPanel()}</aside></div>`;
}
function aLive(){
  if (!ad) return;
  const s = $("#aSum"); if (s) s.innerHTML = aSumHTML();
  const t = $("#aTotBox"); if (t) t.innerHTML = aTotBoxHTML();
  const sc = $("#scHint"); if (sc){ const g = aDays(), p = scontoPerc(g); sc.textContent = `${fmtQ(g)} ${g === 1 ? "giorno" : "giorni"}: ${p ? `sconto del ${p}%` : "nessuno sconto"}.`; }
  const tr = $("#trelloTxt"); if (tr) tr.textContent = trelloLines().join("\n");
  const p = $("#panel"); if (p) p.innerHTML = aPanel();
}
function aRerender(focusSel){
  $("#asteps").innerHTML = aStepsBar();
  $("#stepBody").innerHTML = aStepHTML();
  aLive();
  if (focusSel){ const b = document.querySelector(focusSel); if (b) b.focus({preventScroll:true}); }
}
const ARR = ["kind","fromPrv","cli","noRound","ritiro","riconsegna"];
function aField(el){
  const d = ad; if (!d) return;
  let rr = false, focus = null;
  if (el.dataset.aitem !== undefined){
    const id = el.dataset.aitem, k = el.dataset.k;
    if (k === "on"){ if (el.checked) d.items[id] = {qta:"1"}; else delete d.items[id]; rr = true; focus = `[data-aitem="${id}"][data-k="on"]`; }
    else if (d.items[id]) d.items[id].qta = el.value;
  } else if (el.dataset.an !== undefined){
    const n = d.noleggi[+el.dataset.an]; if (!n) return;
    n[el.dataset.k] = el.value;
    if (el.dataset.k === "paga"){ rr = true; focus = `[data-an="${el.dataset.an}"][data-k="paga"][value="${el.value}"]`; }
  } else if (el.dataset.adate !== undefined){ d.date[+el.dataset.adate] = el.value; }
  else {
    const f = el.dataset.a; d[f] = el.hasAttribute("data-bool") ? el.checked : el.value;
    if (f === "fromPrv") aPrefill(el.value);
    if (f === "kind" && el.value === "noleggio"){ d.fromPrv = ""; Object.keys(d.items).forEach(id => { if (!invItem(id).nol) delete d.items[id]; }); }
    if (f === "ritiro" || f === "riconsegna") d.giorni = "";
    if (ARR.includes(f)){ rr = true; focus = el.type === "radio" ? `[data-a="${f}"][value="${el.value}"]` : `[data-a="${f}"]`; }
  }
  aSave();
  const e = $("#err"); if (e) e.textContent = "";
  if (rr) aRerender(focus); else aLive();
}
function aFilter(q){
  ad.filter = q; const f = q.toLowerCase().trim();
  document.querySelectorAll("[data-aname]").forEach(r => { r.hidden = !!f && !r.dataset.aname.includes(f); });
  document.querySelectorAll("[data-acat]").forEach(h => { h.hidden = ![...document.querySelectorAll(`[data-acat2="${CSS.escape(h.dataset.acat)}"]`)].some(r => !r.hidden); });
}
function aGenerate(){
  const d = ad;
  for (const id of aSteps()){ const m = aValidate(id); if (m){ d.step = id; if (!d.visited.includes(id)) d.visited.push(id); aSave(); route(); $("#err").textContent = m; return; } }
  if (d.kind === "noleggio" && !d.titolo.trim()) d.titolo = "Noleggio attrezzatura";
  const code = aCode();
  const data = JSON.parse(JSON.stringify(d)); ["step","visited","edit","saved","cli","titolo","filter"].forEach(k => delete data[k]);
  const ex = DOCS.find(x => x.code === code && x.tipo === "ATT");
  if (ex){ Object.assign(ex, {cli:d.cli, titolo:d.titolo, data}); ex.versions.push(today()); toast(`Salvata come V${pad2(ex.versions.length)}`); }
  else { DOCS.push({code, tipo:"ATT", cli:d.cli, titolo:d.titolo, versions:[today()], data}); toast("Lista generata"); }
  ad = null; store.del(AKEY); location.hash = "attrezzatura";
}
function aClick(act, a){
  const d = ad; if (!d) return;
  const st = aSteps(), i = st.indexOf(d.step);
  if (act === "a-goto"){ const id = a.dataset.id; if (d.visited.includes(id) || id === d.step){ d.step = id; aSave(); route(); } return; }
  if (act === "a-prev"){ if (i > 0){ d.step = st[i-1]; aSave(); route(); } return; }
  if (act === "a-next"){ const m = aValidate(d.step); if (m){ $("#err").textContent = m; return; } d.step = st[i+1]; if (!d.visited.includes(d.step)) d.visited.push(d.step); aSave(); route(); return; }
  if (act === "a-dateadd"){ d.date.push(""); aSave(); return aRerender(`[data-adate="${d.date.length-1}"]`); }
  if (act === "a-datedel"){ const k = +a.dataset.i; if (d.date.length > 1) d.date.splice(k,1); else d.date[0] = ""; aSave(); return aRerender(); }
  if (act === "a-noladd"){ d.noleggi.push({nome:"", fornitore:"", qta:"1", paga:"io"}); aSave(); return aRerender(`[data-an="${d.noleggi.length-1}"][data-k="nome"]`); }
  if (act === "a-noldel"){ d.noleggi.splice(+a.dataset.i, 1); aSave(); return aRerender(); }
  if (act === "a-setcifra"){ d.cifra = (+a.dataset.v / 100).toLocaleString("it-IT",{minimumFractionDigits:2, useGrouping:false}); d.noRound = false; aSave(); return aRerender(`[data-a="cifra"]`); }
  if (act === "a-trello"){ const l = trelloLines(); return copyText(l.join("\n"), `Copiate ${l.length} righe: in Trello incollale in una checklist`); }
  if (act === "a-generate") return aGenerate();
}
function startNewAtt(){
  const go = () => { if (location.hash === "#attrezzatura-nuova") route(); else location.hash = "attrezzatura-nuova"; };
  if (hasADraft()){
    const st = aSteps(), i = st.indexOf(ad.step);
    modal("C’è una lista in sospeso", `<p>${ad.titolo ? esc(ad.titolo) + ", " : ""}ferma al passo ${i+1} di ${st.length}. Vuoi riprenderla o ricominciare da zero?</p>`,
      [{label:"Ricomincia", fn:() => { ad = ADEF(); store.del(AKEY); go(); }}, {label:"Riprendi", primary:true, fn:go}]);
  } else { ad = ADEF(); go(); }
}

/* ---------- Contratto dal preventivo ---------- */
function speseFrase(d){
  const p = [];
  if (d.speseIncluse.trim()) p.push(`Le spese per ${d.speseIncluse.trim()} sono comprese nel compenso indicato al Punto 5.`);
  if (d.speseFornitori.trim()) p.push(`Le spese per ${d.speseFornitori.trim()} non sono comprese nel compenso: sono a carico del Cliente e gli vengono fatturate direttamente dai fornitori.`);
  if (d.speseAnticipate.trim()) p.push(`Le spese per ${d.speseAnticipate.trim()} non sono comprese nel compenso: sono anticipate dal Videomaker e rimborsate dal Cliente con fattura${d.rifPrv ? `, secondo quanto indicato nel preventivo n. ${d.rifPrv}` : ", per l’importo concordato tra le parti"}.`);
  return p.length ? p.join(" ") : "Il lavoro non prevede spese di trasferta o servizi esterni a carico del Cliente.";
}
function ctrFromPrv(code){
  const doc = DOCS.find(x => x.code === code && x.tipo === "PRV");
  if (!doc || !doc.data) return toast("Questo preventivo d’esempio non ha dati salvati: prova con il 2026-014");
  const build = () => {
    const saved = qd; qd = Object.assign(QDEF(), JSON.parse(JSON.stringify(doc.data)));
    const t = qTot(), ent = Object.entries(qd.voci).filter(([,v]) => v.on);
    const nm = ([id,v]) => { const s = srv(id); return (s ? s.nome : (v.nome || "")).toLowerCase(); };
    const uniq = a => [...new Set(a.filter(Boolean))].join(", ");
    const incl = ent.filter(([,v]) => vm(v) === "tot" && v.esterna).map(nm).concat(qd.noleggi.some(n => n.paga !== "cliente") ? ["noleggio di attrezzatura"] : []);
    const forn = ent.filter(([,v]) => vm(v) === "cons" && v.fatt !== "io").map(nm).concat(qd.noleggi.some(n => n.paga === "cliente") ? ["noleggio di attrezzatura"] : []);
    const ant = ent.filter(([,v]) => vm(v) === "cons" && v.fatt === "io").map(nm);
    const acc = parseNum(qd.accontoPerc), dates = qd.date.filter(Boolean);
    const x = {cli:doc.cli, titolo:doc.titolo, oggetto:qd.desc || "", data:dates[0] || "", luogo:qd.luogo || "",
      consegnaOn:!!qd.consOn, consegnaGiorni:qd.consGiorni || "10", consegnaDa:"riprese",
      modificheOn:!!qd.revOn, modificheN:qd.revN || "2",
      totale:(t.want/100).toLocaleString("it-IT",{minimumFractionDigits:2, useGrouping:false}),
      multi:!!(qd.accontoOn && acc > 0 && acc < 100), modo:"perc",
      rate: qd.accontoOn && acc > 0 && acc < 100 ? [{val:String(acc), quando:"firma", data:""}, {val:String(100 - acc), quando:"consegna", data:""}] : DEF().rate,
      speseIncluse:uniq(incl), speseFornitori:uniq(forn), speseAnticipate:uniq(ant), rifPrv:doc.code};
    qd = saved;
    draft = Object.assign(DEF(), x); saveDraft();
    if (location.hash === "#contratti-nuovo") route(); else location.hash = "contratti-nuovo";
  };
  if (hasDraft()) modal("C’è un contratto in sospeso", `<p>Se crei il contratto dal preventivo ${code}, la bozza in sospeso viene sostituita.</p>`, [{label:"Annulla"}, {label:"Sostituisci", primary:true, fn:build}]);
  else build();
}

/* ---------- Router ---------- */
const TITLES = {home:"Home", attrezzatura:"Attrezzatura", preventivi:"Preventivi", contratti:"Contratti", cortesia:"Copie di cortesia", impostazioni:"Impostazioni", "contratti-nuovo":"Contratti", "preventivi-nuovo":"Preventivi", "cortesia-verifica":"Copie di cortesia", "attrezzatura-nuova":"Attrezzatura"};
const WIZ = {"contratti-nuovo":"contratti", "preventivi-nuovo":"preventivi", "cortesia-verifica":"cortesia", "attrezzatura-nuova":"attrezzatura"};
function route(){
  let h = location.hash.slice(1) || "home";
  if (!TITLES[h]) h = "home";
  const base = WIZ[h] || h;
  document.body.classList.toggle("in-wiz", !!WIZ[h]);
  document.querySelectorAll("[data-nav]").forEach(a => { if (a.dataset.nav === base) a.setAttribute("aria-current","page"); else a.removeAttribute("aria-current"); });
  $("#topTitle").textContent = TITLES[h];
  const v = $("#view");
  if (h === "home") v.innerHTML = home();
  else if (SEC[h]) v.innerHTML = docList(h);
  else if (h === "cortesia") v.innerHTML = cortesia();
  else if (h === "cortesia-verifica"){ if (!CD){ location.replace("#cortesia"); return; } v.innerHTML = cdcView(); cdcLive(); }
  else if (h === "impostazioni") v.innerHTML = settings();
  else if (h === "contratti-nuovo"){ v.innerHTML = wizard(); live(); }
  else if (h === "preventivi-nuovo"){ v.innerHTML = qWizard(); qLive(); }
  else if (h === "attrezzatura-nuova"){ v.innerHTML = aWizard(); aLive(); }
  window.scrollTo(0,0);
}
window.addEventListener("hashchange", route);
function rerenderStep(focusSel){
  $("#stepBody").innerHTML = stepHTML();
  live();
  $("#panel").innerHTML = panelHTML();
  if (focusSel){ const b = document.querySelector(focusSel); if (b) b.focus(); }
}

/* ---------- Modale e avvisi ---------- */
let modalFns = [];
function modal(title, body, buttons){
  closeModal();
  modalFns = buttons.map(b => b.fn || null);
  const el = document.createElement("div");
  el.className = "modal-back"; el.id = "modal";
  el.innerHTML = `<div class="modal" role="dialog" aria-modal="true" aria-labelledby="mt"><h2 id="mt">${title}</h2>${body}
    <div class="actions">${buttons.map((b,i) => `<button class="btn ${b.primary ? "primary" : ""}" data-action="modal-btn" data-i="${i}">${b.label}</button>`).join("")}</div></div>`;
  document.body.appendChild(el);
  (el.querySelector(".btn.primary") || el.querySelector(".btn")).focus();
}
function closeModal(){ const m = $("#modal"); if (m) m.remove(); }
let toastT;
function toast(msg){ const t = $("#toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("show"), 2800); }

$("#cdcIn").addEventListener("change", e => {
  const f = e.target.files[0]; e.target.value = "";
  if (!f) return;
  CD = cdcParse(f.name, cdcMode);
  if (location.hash === "#cortesia-verifica") route(); else location.hash = "cortesia-verifica";
});
/* ---------- Modifica e caricamento PDF ---------- */
function openEdit(d, fromV){
  const s = secByTipo(d.tipo)[1], v = d.versions.length;
  modal(`Modifica ${s.sing} ${d.code}`,
    `<p>Stai aprendo la <strong>V${pad2(fromV)}</strong>${fromV < v ? `, ma in archivio c’è già la V${pad2(v)}` : ""}.</p>
     <p>Dopo le modifiche verrà salvato come:</p><p class="fname"><strong>${esc(fname(d, v+1))}.pdf</strong></p>`,
    [{label:"Annulla"}, {label:"Apri per modificare", primary:true, fn:() => {
      if (d.tipo === "PRV"){
        if (!d.data){ toast("Questo preventivo d’esempio non ha dati salvati: prova con il 2026-014"); return; }
        qd = Object.assign(QDEF(), JSON.parse(JSON.stringify(d.data)), {cli:d.cli, titolo:d.titolo, step:"cliente", visited:QSTEPS_ALL.map(x => x[0]), edit:{code:d.code}});
        qSave();
        if (location.hash === "#preventivi-nuovo") route(); else location.hash = "preventivi-nuovo";
        return;
      }
      if (d.tipo === "ATT"){
        if (!d.data){ toast("Questa lista d’esempio non ha dati salvati"); return; }
        ad = Object.assign(ADEF(), JSON.parse(JSON.stringify(d.data)), {cli:d.cli, titolo:d.titolo, step:"tipo", visited:["tipo","dati","articoli","totale","riep"], edit:{code:d.code}});
        aSave();
        if (location.hash === "#attrezzatura-nuova") route(); else location.hash = "attrezzatura-nuova";
        return;
      }
      draft = Object.assign(DEF(), JSON.parse(JSON.stringify(d.data || {})), {cli:d.cli, titolo:d.titolo, step:0, max:STEPS.length-1, edit:{code:d.code}});
      saveDraft();
      if (location.hash === "#contratti-nuovo") route(); else location.hash = "contratti-nuovo";
    }}]);
}
let uploadSec = null;
$("#pdfIn").addEventListener("change", e => {
  const f = e.target.files[0]; e.target.value = "";
  if (!f) return;
  const s = SEC[uploadSec];
  const m = f.name.replace(/\.pdf$/i,"").match(/^(\d{4}-\d{3})_(PRV|CTR|ATT)_.+?(?:_V(\d{2}))?$/);
  if (!m) return modal("Codice documento non trovato",
    `<p>Il nome <strong class="fname">${esc(f.name)}</strong> non contiene un codice documento. I file creati dall’app si chiamano, ad esempio, <span class="fname">2026-014_CTR_Progetto_Cliente_FilippoMauro.pdf</span>.</p><p>Puoi anche scegliere il documento dall’elenco e premere “Modifica”.</p>`,
    [{label:"Chiudi", primary:true}]);
  if (m[2] !== s.tipo){ const o = secByTipo(m[2]); return modal("Documento di un’altra sezione", `<p>Questo file è un ${o[1].sing}. Caricalo dalla sezione ${o[1].title}.</p>`, [{label:"Chiudi"},{label:"Vai a "+o[1].title, primary:true, fn:() => location.hash = o[0]}]); }
  const d = DOCS.find(x => x.code === m[1] && x.tipo === m[2]);
  if (!d) return modal("Documento non in archivio", `<p>Il codice ${m[1]} non corrisponde a nessun ${s.sing} salvato.</p>`, [{label:"Chiudi", primary:true}]);
  openEdit(d, m[3] ? +m[3] : 1);
});

const ctrCode = d => d.rifPrv && !DOCS.some(x => x.code === d.rifPrv && x.tipo === "CTR") ? d.rifPrv : nextCode();
function startNewContract(){
  const go = () => { if (location.hash === "#contratti-nuovo") route(); else location.hash = "contratti-nuovo"; };
  if (hasDraft()){
    const c = draft.cli ? cliente(draft.cli) : null;
    modal("C’è un contratto in sospeso", `<p>${c ? "Per "+esc(c.nome)+", " : ""}fermo al passo ${draft.step+1} di ${STEPS.length}. Vuoi riprenderlo o ricominciare da zero?</p>`,
      [{label:"Ricomincia", fn:() => { draft = DEF(); store.del(DKEY); go(); }}, {label:"Riprendi", primary:true, fn:go}]);
  } else { draft = DEF(); go(); }
}

/* ---------- Eventi ---------- */
document.addEventListener("click", e => {
  const a = e.target.closest("[data-action]"); if (!a) return;
  const act = a.dataset.action, d = draft;
  if (act === "modal-btn"){ const fn = modalFns[+a.dataset.i]; closeModal(); if (fn) fn(); return; }
  if (act === "soon") return toast(a.dataset.msg);
  if (act === "dl") return toast(`Prototipo: qui si scarica ${a.dataset.kind}, ${a.dataset.name}`);
  if (act === "picker") return toast(`Si apre il selettore di Google Drive per: ${a.dataset.n}`);
  if (act === "inventario") return toast({completo:"Listino completo: servizi e kit a pagina 1, noleggio attrezzatura a pagina 2", noleggio:"Listino noleggio attrezzatura", lista:"Lista attrezzatura senza prezzi"}[$("#dlKind").value]);
  if (act === "upload"){ uploadSec = a.dataset.sec; $("#pdfIn").click(); return; }
  if (act === "edit"){ const doc = DOCS.find(x => x.code === a.dataset.code && x.tipo === a.dataset.tipo); return openEdit(doc, doc.versions.length); }
  if (act === "new-ctr") return startNewContract();
  if (act === "new-prv") return startNewQuote();
  if (act === "cdc-new") return cdcPick(null);
  if (act === "cdc-ver"){ const n = a.dataset.num, f = cdcFind(n);
    return modal(`Nuova versione della ${n}`, `<p>Carica il PDF corretto da Fiscozen: viene letto da zero e salvato come <strong>V${pad2(f.versions.length+1)}</strong> di questa copia.</p><p class="fname muted">${esc(cdcName(n, f.cli, f.versions.length+1))}.pdf</p>`,
      [{label:"Annulla"}, {label:"Scegli il PDF", primary:true, fn:() => cdcPick(n)}]); }
  if (act === "cdc-rowadd"){ CD.righe.push({desc:"", imp:""}); route(); const r = document.querySelector(`[data-cdr="${CD.righe.length-1}"][data-k="desc"]`); if (r) r.focus(); return; }
  if (act === "cdc-rowdel"){ if (CD.righe.length > 1) CD.righe.splice(+a.dataset.i, 1); const y = window.scrollY; route(); window.scrollTo(0, y); return; }
  if (act === "cdc-gen") return cdcGenerate();
  if (act === "crea-ctr") return ctrFromPrv(a.dataset.code);
  if (act === "new-att") return startNewAtt();
  if (act === "trello-doc"){ const doc = DOCS.find(x => x.code === a.dataset.code && x.tipo === "ATT"); const l = trelloLines(doc.data); return copyText(l.join("\n"), `Copiate ${l.length} righe: in Trello incollale in una checklist`); }
  if (act.startsWith("a-")) return aClick(act, a);
  if (act.startsWith("q-")) return qClick(act, a);
  if (act === "panel") return $("#panel").classList.toggle("open");
  if (act === "fase-add"){ d.fasi.push(""); saveDraft(); return rerenderStep(`[data-fase="${d.fasi.length-1}"]`); }
  if (act === "fase-del"){ const i = +a.dataset.i; if (d.fasi.length > 1) d.fasi.splice(i,1); else d.fasi[0] = ""; saveDraft(); return rerenderStep(); }
  if (act === "fase-up"){ const i = +a.dataset.i; [d.fasi[i-1], d.fasi[i]] = [d.fasi[i], d.fasi[i-1]]; saveDraft(); return rerenderStep(`[data-fase="${i-1}"]`); }
  if (act === "resto"){
    const tot = parseNum(d.totale), target = d.modo === "perc" ? 100 : tot;
    if (!(target > 0)) return toast("Inserisci prima il compenso totale");
    const others = d.rate.slice(0,-1).reduce((s,r) => s + (parseNum(r.val) || 0), 0);
    const rest = Math.round((target - others) * 100) / 100;
    if (rest <= 0) return toast("Le altre soluzioni coprono già tutto il totale");
    d.rate[d.rate.length-1].val = rest.toLocaleString("it-IT",{maximumFractionDigits:2, useGrouping:false});
    saveDraft(); return rerenderStep();
  }
  if (act === "goto"){ d.step = +a.dataset.i; saveDraft(); route(); return; }
  if (act === "prev"){ d.step--; saveDraft(); route(); return; }
  if (act === "next"){
    const msg = validate();
    if (msg){ $("#err").textContent = msg; return; }
    d.step++; d.max = Math.max(d.max, d.step); saveDraft(); route(); return;
  }
  if (act === "generate"){
    for (let i = 0; i < STEPS.length - 1; i++){ d.step = i; const msg = validate(); if (msg){ saveDraft(); route(); $("#err").textContent = msg; return; } }
    d.step = STEPS.length - 1;
    const data = JSON.parse(JSON.stringify(d)); ["step","max","edit","saved","cli","titolo"].forEach(k => delete data[k]);
    if (d.edit){
      const doc = DOCS.find(x => x.code === d.edit.code && x.tipo === "CTR");
      Object.assign(doc, {cli:d.cli, titolo:d.titolo, data});
      doc.versions.push(today());
      toast(`Salvato come V${pad2(doc.versions.length)}`);
    } else {
      DOCS.push({code:ctrCode(d), tipo:"CTR", cli:d.cli, titolo:d.titolo, versions:[today()], data});
      toast("Contratto generato");
    }
    draft = null; store.del(DKEY); location.hash = "contratti";
  }
});
document.addEventListener("keydown", e => { if (e.key === "Escape"){ closeModal(); const p = $("#panel"); if (p) p.classList.remove("open"); } });

const RERENDER = ["cli","consegnaOn","materialeOn","modificheOn","multi","unicaQuando","modo","nRate","trasportiOn","trasportiTipo","licenza","musicaOn"];
function onField(el){
  const d = draft;
  let focusSel = null, needs = false;
  if (el.dataset.fase !== undefined){ d.fasi[+el.dataset.fase] = el.value; }
  else if (el.dataset.rate !== undefined){
    d.rate[+el.dataset.rate][el.dataset.k] = el.value;
    if (el.dataset.k === "quando"){ needs = true; focusSel = `[data-rate="${el.dataset.rate}"][data-k="quando"]`; }
  } else {
    const f = el.dataset.field;
    if (f === "usi") d.usi = [...document.querySelectorAll('[data-field="usi"]:checked')].map(x => x.value);
    else if (el.hasAttribute("data-bool")) d[f] = el.checked;
    else if (f === "nRate"){ const n = +el.value; while (d.rate.length < n) d.rate.push({val:"", quando:"consegna", data:""}); d.rate.length = n; }
    else if (f === "modo" && el.value !== d.modo){
      const tot = parseNum(d.totale);
      d.rate.forEach(r => { const v = parseNum(r.val); if (v > 0 && tot > 0){ const nv = el.value === "euro" ? tot*v/100 : v/tot*100; r.val = (Math.round(nv*100)/100).toLocaleString("it-IT",{maximumFractionDigits:2, useGrouping:false}); } });
      d.modo = el.value;
    }
    else d[f] = el.value;
    if (RERENDER.includes(f)){ needs = true; focusSel = el.type === "radio" ? `[data-field="${f}"][value="${el.value}"]` : `[data-field="${f}"]`; }
  }
  saveDraft();
  $("#err").textContent = "";
  if (needs) rerenderStep(focusSel);
  else { live(); $("#panel").innerHTML = panelHTML(); }
}
document.addEventListener("input", e => {
  const t = e.target;
  const textLike = t.tagName !== "SELECT" && t.type !== "radio" && t.type !== "checkbox";
  if (textLike && (t.matches("[data-field]") || t.matches("[data-fase]") || t.matches("[data-rate]"))) onField(t);
  if (t.matches("[data-filter]")){
    const q = t.value.toLowerCase().trim();
    document.querySelectorAll("#docs .doc").forEach(r => r.hidden = q && !r.dataset.search.includes(q));
  }
  if (t.dataset.setting === "label4") store.set("fm-label4", t.value);
  if (CD && (t.dataset.cd !== undefined || t.dataset.cdr !== undefined) && t.tagName !== "SELECT" && t.type !== "checkbox"){
    if (t.dataset.cdr !== undefined) CD.righe[+t.dataset.cdr][t.dataset.k] = t.value; else CD[t.dataset.cd] = t.value;
    $("#err").textContent = ""; cdcLive();
  }
  if (t.dataset.setting === "listino") store.set("fm-listino", t.value);
  if (t.dataset.setting === "magg") store.set("fm-magg", t.value);
  if (textLike && t.matches("[data-q],[data-qv],[data-qitem],[data-qdate],[data-qn]")) qField(t);
  if (textLike && t.matches("[data-a],[data-aitem],[data-adate],[data-an]")) aField(t);
  if (t.matches("[data-afilter]")) aFilter(t.value);
});
document.addEventListener("change", e => {
  const t = e.target;
  if ((t.matches("[data-field]") || t.matches("[data-rate]")) && (t.type === "radio" || t.type === "checkbox" || t.tagName === "SELECT")) onField(t);
  if (t.dataset.setting === "tema"){ store.set("fm-tema", t.value); applyTheme(); }
  if (t.matches("[data-q],[data-qv],[data-qitem],[data-qdate],[data-qn]") && (t.type === "radio" || t.type === "checkbox" || t.tagName === "SELECT")) qField(t);
  if (t.matches("[data-a],[data-aitem],[data-adate],[data-an]") && (t.type === "radio" || t.type === "checkbox" || t.tagName === "SELECT")) aField(t);
  if (CD && t.dataset.cd !== undefined && (t.tagName === "SELECT" || t.type === "checkbox")){ CD[t.dataset.cd] = t.type === "checkbox" ? t.checked : t.value; cdcLive(); }
  if (t.dataset.stato !== undefined){ const doc = DOCS.find(x => x.code === t.dataset.stato && x.tipo === "PRV"); doc.stato = t.value; const y = window.scrollY; route(); window.scrollTo(0, y); }
});

route();
</script>
</body>
